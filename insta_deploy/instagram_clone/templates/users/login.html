{% extends 'base.html' %}
{% block title %}Log In · Instaclone{% endblock %}

{% block content %}
<div class="d-flex align-items-center justify-content-center min-vh-100 bg-light">
  <div style="width: 100%; max-width: 380px;">

    <div class="bg-white border rounded p-4 mb-3 text-center">
      <h1 class="mb-4" style="font-family:'Grand Hotel',cursive;font-size:3.2rem;font-weight:400;">Instaclone</h1>

      <form method="post" novalidate>
        {% csrf_token %}
        {% for field in form %}
          <div class="mb-3">
            {{ field }}
            {% if field.errors %}
              <div class="text-danger small mt-1">{{ field.errors.0 }}</div>
            {% endif %}
          </div>
        {% endfor %}
        <button type="submit" class="btn btn-primary w-100 fw-semibold">Log In</button>
      </form>

      <div class="d-flex align-items-center my-3">
        <hr class="flex-grow-1"><span class="px-2 text-muted small">OR</span><hr class="flex-grow-1">
      </div>
    </div>

    <div class="bg-white border rounded p-3 text-center">
      Don't have an account?
      <a href="{% url 'users:register' %}" class="fw-semibold text-decoration-none">Sign up</a>
    </div>

  </div>
</div>
{% endblock %}
