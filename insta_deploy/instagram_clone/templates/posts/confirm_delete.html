{% extends 'base.html' %}
{% block title %}Delete Post · Instaclone{% endblock %}

{% block content %}
<div class="content-wrap" style="max-width:400px;">
  <div class="bg-white border rounded p-4 text-center">
    <i class="bi bi-exclamation-triangle fs-1 text-danger d-block mb-3"></i>
    <h5 class="mb-2">Delete post?</h5>
    <p class="text-muted small mb-4">This can't be undone.</p>
    <form method="post">
      {% csrf_token %}
      <button type="submit" class="btn btn-danger w-100 mb-2 fw-semibold">Delete</button>
    </form>
    <a href="{% url 'posts:post_detail' post_id=post.id %}" class="btn btn-outline-secondary w-100">Cancel</a>
  </div>
</div>
{% endblock %}
